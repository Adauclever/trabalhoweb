
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Authors - Reading Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div id="header-container"></div>

    <main>
        <h2>Author Management</h2>
        <p>Add and manage authors.</p>

        <section>
            <h3 id="form-heading">Add New Author</h3>

            <form id="author-form" novalidate>

                <input type="hidden" id="author-id">

                <label for="author-name">Author Name</label>
                <input
                    type="text"
                    id="author-name"
                    required
                    placeholder="Enter author name"
                >
                <small class="field-error" id="name-error"></small>

                <label for="author-country">Nationality</label>
                <select id="author-country">
                    <option value="">Unknown</option>
                </select>

                <label for="birth-date">Birth Date</label>
                <input type="date" id="birth-date">
                <small class="field-error" id="birth-error"></small>

                <label for="death-date">Death Date</label>
                <input type="date" id="death-date">
                <small class="field-error" id="death-error"></small>

                <button type="submit" id="save-author">
                    Save Author
                </button>

                <button type="button" id="cancel-edit" hidden>
                    Cancel Edit
                </button>

            </form>
        </section>

        <section>
    <h3>Registered Authors</h3>

    <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input
            type="text"
            id="author-search"
            placeholder="Search authors by name..."
        >
    </div>

    <div class="list-container">
        <div id="authors-list"></div>
    </div>
</section>
    </main>

    <!-- Delete Confirmation Modal -->
<div id="delete-modal" class="delete-modal">

    <div class="delete-content">

        <div class="delete-icon">
            <i class="fa-solid fa-trash"></i>
        </div>

        <h2>Delete Author?</h2>

        <p id="delete-message">
            Are you sure you want to delete this author?
        </p>

        <div class="delete-actions">

            <button type="button" id="cancel-delete">
                Cancel
            </button>

            <button type="button" id="confirm-delete">
                <i class="fa-solid fa-trash"></i>
                Delete
            </button>

        </div>

    </div>

</div>

    <div id="success-modal" class="success-modal">
    <div class="success-content">
        <div class="success-icon">
            <i class="fa-solid fa-check"></i>
        </div>

        <h2>Success!</h2>
        <p id="success-message">Registration completed successfully!</p>

        <button type="button" id="success-button">OK</button>
    </div>
</div>

    <script src="js/components.js"></script>

    <script type="module" src="js/authors.js"></script>
</body>
</html>
